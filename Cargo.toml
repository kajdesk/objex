[package]
name = "objex"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "Elastic-2.0"
description = "A fast, lightweight, S3 / Cloudflare R2 compatible object storage server"
repository = "https://github.com/kajdesk/objex"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32c = "0.6.8"
crc32fast = "1.5.2"
crc64fast-nvme = "1.2.1"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "server-graceful", "http1", "http2"] }
libc = "0.2.189"
md-5 = "0.11.0"
percent-encoding = "2.3.2"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.10.3"
redb = "4.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.150.0", features = ["behavior-version-latest"] }
aws-sigv4 = "1.6.0"
aws-smithy-runtime-api = "1.18.0"
bytes = "1.12.1"
reqwest = { version = "0.13.5", default-features = false }
