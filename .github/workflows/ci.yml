name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/objex ./cmd/objex-bench

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: objex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose smoke test
        working-directory: examples/docker-compose
        env:
          OBJEX_IMAGE: objex:ci
          OBJEX_ACCESS_KEY: OBXCITESTKEY00000001
          OBJEX_SECRET_KEY: ci-secret-not-used-anywhere-else-000000
        run: |
          docker compose up -d --wait objex
          docker compose --profile test run --rm smoke-test
          docker compose --profile test down -v
